controller_manager:
  ros__parameters:
    update_rate: 40  # Hz

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController


joint_state_broadcaster:         
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 20.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 3.05
      Joint_1: {trajectory: 0.3, goal: 0.05}
      Joint_2: {trajectory: 0.3, goal: 0.05}
      Joint_3: {trajectory: 0.3, goal: 0.05}
      Joint_4: {trajectory: 0.3, goal: 0.05}
      Joint_5: {trajectory: 0.3, goal: 0.05}
      Joint_6: {trajectory: 0.3, goal: 0.05}
    stop_trajectory_duration: 0.5


forward_position_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    interface_name: position

gripper_controller:
  ros__parameters:
    joints:
      - Joint_finger1

    command_interfaces:
      - position

    state_interfaces:
      - position
